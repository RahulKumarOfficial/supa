<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reset Password | GiftBuyer</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial,sans-serif;
    background:linear-gradient(
        135deg,
        #111827,
        #4f46e5
    );
}

.box{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    margin-top:0;
    color:#111827;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    margin-bottom:15px;
    outline:none;
}

input:focus{
    border-color:#4f46e5;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#4f46e5;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#4338ca;
}

.message{
    text-align:center;
    margin-top:15px;
    line-height:1.5;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#4f46e5;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="box">

<h1>Reset Password</h1>

<div class="subtitle">
Create a new GiftBuyer admin password
</div>

<form id="resetForm">

<label>New Password</label>

<input
    type="password"
    id="password"
    required
    minlength="6"
    autocomplete="new-password"
    placeholder="Enter new password"
>

<label>Confirm Password</label>

<input
    type="password"
    id="confirmPassword"
    required
    minlength="6"
    autocomplete="new-password"
    placeholder="Confirm new password"
>

<button type="submit">
Update Password
</button>

</form>

<div
    id="message"
    class="message">
</div>

<a
    href="admin-login.html"
    class="back">
← Back to Admin Login
</a>

</div>

<script>

const SUPABASE_URL =
"https://pndmtbntmvmeonjnoeds.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lQkSQdQIWm4o4AyKE0RzsQ_G_NDNtuB";

const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const message =
document.getElementById("message");


/* CHECK RESET SESSION */

async function checkSession(){

    const {
        data:{session}
    } = await client.auth.getSession();

    if(!session){

        message.textContent =
            "This password reset link is invalid or has expired.";

        message.style.color =
            "#dc2626";

        document
        .getElementById("resetForm")
        .style.display = "none";

    }

}

checkSession();


/* UPDATE PASSWORD */

document
.getElementById("resetForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const password =
            document
            .getElementById("password")
            .value;

        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        if(password !== confirmPassword){

            message.textContent =
                "Passwords do not match.";

            message.style.color =
                "#dc2626";

            return;

        }


        if(password.length < 6){

            message.textContent =
                "Password must be at least 6 characters.";

            message.style.color =
                "#dc2626";

            return;

        }


        message.textContent =
            "Updating password...";

        message.style.color =
            "#4f46e5";


        const {
            error
        } =
        await client.auth.updateUser({

            password:password

        });


        if(error){

            message.textContent =
                error.message;

            message.style.color =
                "#dc2626";

            return;

        }


        message.textContent =
            "Password updated successfully. Redirecting...";

        message.style.color =
            "#16a34a";


        await client.auth.signOut();


        setTimeout(function(){

            window.location.replace(
                "admin-login.html"
            );

        },1500);

    }
);

</script>

</body>
</html>
